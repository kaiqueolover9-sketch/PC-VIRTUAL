
name: PC Virtual Tailscale

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Instalar Área de Trabalho
        run: |
          sudo apt update
          sudo DEBIAN_FRONTEND=noninteractive apt install -y \
            xfce4 xfce4-goodies \
            xrdp xorgxrdp dbus-x11

      - name: Criar Usuário do PC
        env:
          PC_PASSWORD: ${{ secrets.PC_PASSWORD }}
        run: |
          sudo useradd -m -s /bin/bash pcuser
          echo "pcuser:$PC_PASSWORD" | sudo chpasswd

          sudo -u pcuser bash -c \
            'echo "startxfce4" > ~/.xsession'

      - name: Iniciar RDP
        run: |
          sudo systemctl enable xrdp
          sudo systemctl restart xrdp

      - name: Conectar ao Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Mostrar IP do PC
        run: |
          echo "IP Tailscale:"
          tailscale ip -4

          echo "Porta RDP: 3389"

      - name: Manter PC Virtual Ativo
        run: |
          echo "PC Virtual iniciado!"
          sleep infinity
